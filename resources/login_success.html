<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Successful — Mosaic Data Model Skill</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2d3249;
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      80%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 28px;
      background: #0d2218;
      border: 1px solid #166534;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      color: #4ade80;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .skill-name {
      margin-top: 36px;
      font-size: 12px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .close-hint {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Login Successful!</h1>
    <p>Your session has been authenticated and your access token was captured securely.</p>
    <div class="badge">
      <span class="pulse"></span>Active Session — Keepalive in progress
    </div>
    <p class="close-hint" style="margin-top:20px;">
      You can now <strong>close this window</strong> and return to Antigravity to continue.
    </p>
    <p class="skill-name">Mosaic Data Model Skill · Strategy / MicroStrategy</p>
  </div>
  <script>
    // Automatically close window after 4 seconds
    setTimeout(() => { window.close(); }, 4000);
  </script>
</body>
</html>
